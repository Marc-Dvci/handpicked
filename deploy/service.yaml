# Cloud Run service. deploy/deploy.sh fills IMAGE and applies it with `gcloud run services replace`.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: handpicked
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"          # spend ceiling on compute
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/cpu-throttling: "true"       # billed only while a request runs
    spec:
      containerConcurrency: 8
      timeoutSeconds: 120
      containers:
        - image: IMAGE
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
          env:
            - name: HANDPICKED_DAY_UNITS        # YouCam units the demo may spend per day
              value: "30"
            - name: HANDPICKED_SESSION_UNITS    # per visitor session
              value: "6"
            - name: HANDPICKED_UNIT_FLOOR       # live try-ons stop before the account drops below this
              value: "150"
            - name: HANDPICKED_DAY_TOKENS       # Model Studio tokens per day
              value: "60000"
            - name: YOUCAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: youcam-api-key
                  key: latest
            - name: DASHSCOPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dashscope-api-key
                  key: latest
          startupProbe:
            httpGet:
              path: /api/health
            periodSeconds: 2
            failureThreshold: 30
