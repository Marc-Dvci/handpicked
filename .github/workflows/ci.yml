name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check handpicked tests eval tools
      - name: Unit, API and service tests (replay mode, no keys)
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web app
        working-directory: web
        run: npm ci && npm run build && npx oxlint src
      - name: Browser tests with axe-core (every screen and button)
        working-directory: web
        run: npx playwright install --with-deps chromium && npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-tests
          path: web/test-results

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t handpicked .
      - name: Run it in replay mode and call the API
        run: |
          docker run -d --name hp -p 8080:8080 handpicked
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && break; sleep 2; done
          curl -sf localhost:8080/api/samples | python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d['hands']) == 7 and len(d['recorded']) == 18; print('samples ok')"
          curl -sf localhost:8080/ | grep -q "<title>Handpicked</title>" && echo "web app ok"
          curl -sf -X POST localhost:8080/api/tryon -H 'content-type: application/json' \
            -d '{"hand_id":"hand-1","shape":"oval","width_mm":5.62,"metal":"platinum"}' | python3 -c "import json,sys; t=json.load(sys.stdin); assert t['cached'] and t['audit']['passed']; print('replayed try-on ok')"
      - if: failure()
        run: docker logs hp || true
